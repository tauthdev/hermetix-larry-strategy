spring:
  application:
    name: next-larry-strategy

server:
  port: 8081

next:
  api:
    client-id: ${NEXT_CLIENT_ID:}
    client-secret: ${NEXT_CLIENT_SECRET:}
    account-id: ${NEXT_ACCOUNT_ID:acc_main}
  engine:
    max-consecutive-failures: 5

larry:
  symbols: AAPL,MSFT
  lookback: 24
  multiplier: 1.2
  expire-hours: 48
  budget-ratio: 0.5
  poll-seconds: 60
